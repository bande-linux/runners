name: unbound-runners

x-runner: &runner
  build: .
  image: unbound-runner:2.338.0-trixie
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  devices:
    - /dev/kvm:/dev/kvm
  environment: &env
    RUNNER_ORG: unbound-linux
    RUNNER_LABELS: unbound
    SCCACHE_DIR: /cache/sccache
    # Eight runners share one VM disk with other services.
    SCCACHE_CACHE_SIZE: 8G
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/job-started.sh

services:
  runner-1:
    <<: *runner
    hostname: unbound-runner-1
    environment:
      <<: *env
      RUNNER_NAME: unbound-runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-1:/state
      - work-1:/work
      - cache-1:/cache

  runner-2:
    <<: *runner
    hostname: unbound-runner-2
    environment:
      <<: *env
      RUNNER_NAME: unbound-runner-2
