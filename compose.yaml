name: unbound-runners

x-runner: &runner
  build: .
  image: unbound-runner:2.338.0
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  devices:
    - /dev/kvm:/dev/kvm
  environment: &env
    RUNNER_ORG: unbound-linux
    RUNNER_LABELS: unbound
    SCCACHE_DIR: /cache/sccache
    SCCACHE_CACHE_SIZE: 50G

services:
  runner-1:
    <<: *runner
    hostname: unbound-runner-1
    environment:
      <<: *env
      RUNNER_NAME: unbound-runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-1:/state
      - work-1:/work
      - cache-1:/cache

  runner-2:
    <<: *runner
    hostname: unbound-runner-2
    environment:
      <<: *env
      RUNNER_NAME: unbound-runner-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-2:/state
      - work-2:/work
      - cache-2:/cache

  runner-3:
    <<: *runner
    hostname: unbound-runner-3
    environment:
      <<: *env
      RUNNER_NAME: unbound-runner-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-3:/state
      - work-3:/work
      - cache-3:/cache

volumes:
  state-1:
  state-2:
  state-3:
  work-1:
  work-2:
  work-3:
  cache-1:
  cache-2:
  cache-3:
