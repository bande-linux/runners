name: unbound-runners

# Four runners share one 8-CPU VM with other services: three for builds and tests, and one for jobs
# that boot a KVM guest, so at most one guest runs at a time. Jobs pick it with
# `runs-on: [self-hosted, unbound-kvm]`; everything else uses `[self-hosted, unbound]`.
# RUNNER_HOST names the runners per machine (unbound-runner-1 on the mini, laptop-runner-1 with
# RUNNER_HOST=laptop), so several machines can serve the same labels.

x-runner: &runner
  build: .
  image: unbound-runner:2.338.0-trixie
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &env
    RUNNER_ORG: unbound-linux
    RUNNER_LABELS: unbound
    SCCACHE_DIR: /cache/sccache
    SCCACHE_CACHE_SIZE: 8G
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/job-started.sh

services:
  runner-1:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-1
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-1:/state
      - work-1:/work
      - cache-1:/cache

  runner-2:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-2
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-2:/state
      - work-2:/work
      - cache-2:/cache

  runner-3:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-3
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-3:/state
      - work-3:/work
      - cache-3:/cache

  runner-kvm:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-kvm
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-kvm
      RUNNER_LABELS: unbound-kvm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-kvm:/state
      - work-kvm:/work
      - cache-kvm:/cache

volumes:
  state-1:
  state-2:
  state-3:
  state-kvm:
  work-1:
  work-2:
  work-3:
  work-kvm:
  cache-1:
  cache-2:
  cache-3:
  cache-kvm:
