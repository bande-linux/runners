name: unbound-runners

# Three runners share one 8-CPU, 12 GB VM with other services: two for builds and tests, and one for
# jobs that boot a KVM guest, so at most one guest runs at a time. A fourth runner let four Rust
# builds (or three and a 4 GB guest) run at once, which ran the VM out of memory. Jobs pick it with
# `runs-on: [self-hosted, unbound-kvm]`; everything else uses `[self-hosted, unbound]`.
# RUNNER_HOST names the runners per machine (unbound-runner-1 on the mini, laptop-runner-1 with
# RUNNER_HOST=laptop), so several machines can serve the same labels.
# All three runners on a machine share one compiler cache: sccache stores its entries in the
# build-cache service over WebDAV, which writes each entry atomically and lets every runner see
# every other runner's entries at once; build-cache-trim keeps it under BUILD_CACHE_GIB.

x-runner: &runner
  build: .
  image: unbound-runner:2.338.0-trixie
  restart: unless-stopped
  depends_on:
    - build-cache
  env_file:
    - path: .env
      required: false
  environment: &env
    RUNNER_ORG: unbound-linux
    RUNNER_LABELS: unbound
    SCCACHE_WEBDAV_ENDPOINT: http://build-cache:8080/sccache/
    SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/job-started.sh

services:
  build-cache:
    build: build-cache
    image: unbound-build-cache:trixie
    restart: unless-stopped
    volumes:
      - build-cache:/var/cache/build

  build-cache-trim:
    image: unbound-build-cache:trixie
    restart: unless-stopped
    command: ["trim-build-cache"]
    environment:
      BUILD_CACHE_GIB: ${BUILD_CACHE_GIB:-20}
    volumes:
      - build-cache:/var/cache/build
    depends_on:
      - build-cache

  runner-1:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-1
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-1:/state
      - work-1:/work
      - cache-1:/cache

  runner-2:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-2
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-2:/state
      - work-2:/work
      - cache-2:/cache

  runner-kvm:
    <<: *runner
    hostname: ${RUNNER_HOST:-unbound}-runner-kvm
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      <<: *env
      RUNNER_NAME: ${RUNNER_HOST:-unbound}-runner-kvm
      RUNNER_LABELS: unbound-kvm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state-kvm:/state
      - work-kvm:/work
      - cache-kvm:/cache

volumes:
  build-cache:
  state-1:
  state-2:
  state-kvm:
  work-1:
  work-2:
  work-kvm:
  cache-1:
  cache-2:
  cache-kvm:
